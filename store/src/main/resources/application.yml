spring:
  application:
    name: onlineStore
  output:
    ansi:
      enabled: ALWAYS

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: store-client
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
           issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9090/realms/store-realm}

  r2dbc:
    url: r2dbc:h2:mem:///mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  sql:
    init:
      mode: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
    cache:
      redis:
        time-to-live: 10m

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always

info:
  app:
    name: My online store
    version: 1.0.0

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081}